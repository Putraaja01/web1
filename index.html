<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfirmasi Pesanan kang/neng</title>
    
    <!-- Google Fonts: Playfair Display & Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .luxury-card {
            background: rgba(26, 26, 46, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 0 0 35px rgba(212, 175, 55, 0.1);
            position: relative;
            overflow: hidden;
        }

        /* Garis Emas di Atas Card */
        .luxury-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #bf953f, #fcf6ba, #b38728, #fbf5b7);
        }

        .header-icon {
            text-align: center;
            margin-bottom: 20px;
        }

        .header-icon i {
            font-size: 42px;
            background: linear-gradient(135deg, #fcf6ba 0%, #bf953f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            text-align: center;
            color: #f8fafc;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        p.subtitle {
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px 14px 46px;
            background: rgba(15, 15, 26, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: #bf953f;
            box-shadow: 0 0 12px rgba(191, 149, 63, 0.3);
            background: rgba(15, 15, 26, 0.9);
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 41px;
            color: #bf953f;
            font-size: 16px;
        }

        .btn-confirm {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #bf953f 0%, #aa771c 100%);
            color: #0f0f1a;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            box-shadow: 0 6px 20px rgba(191, 149, 63, 0.35);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-confirm:hover {
            background: linear-gradient(135deg, #d4af37 0%, #bf953f 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(191, 149, 63, 0.5);
        }

        .footer-note {
            text-align: center;
            margin-top: 25px;
            font-size: 11px;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div class="luxury-card">
        <div class="header-icon">
            <i class="fa-solid fa-gem"></i>
        </div>
        <h1>Konfirmasi Pesanan</h1>
        <p class="subtitle">REQUEST DULU BOSS USER AMA PW NYA, BIAR MIMIN BISA LANGSUNG BIKIN AKUN LU</p>

        <form id="orderForm">
            <div class="input-group">
                <label for="username">Req Username Buat Lu Login</label>
                <i class="fa-solid fa-user input-icon"></i>
                <input type="text" id="username" class="input-field" placeholder="Request sesuai keinginan lu" required autocomplete="off">
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" id="password" class="input-field" placeholder="Masukkan password sesuai keinginan lu" required>
            </div>

            <button type="submit" class="btn-confirm">
                <i class="fa-brands fa-whatsapp" style="font-size: 18px;"></i> 🚀 GASS ORDER
            </button>
        </form>

        <div class="footer-note">
            <i class="fa-solid fa-shield-halved" style="color: #bf953f;"></i> Aman Username Ama Pw Lu Gak Akan Di Sebar Kemana Mana
        </div>
    </div>

    <script>
        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Mengambil data dari input form
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            // Ganti nomor WhatsApp di bawah ini (Format: Kode Negara + Nomor, contoh: 6281234567890)
            const phoneNumber = "6285789797426"; 

            // Menyusun format pesan WhatsApp
            const message = `ASSALAMUALAIKUM MIN GW UDAH ORDER NIHH DETAIL AKUN YANG GW REQUEST %0A%0A*Detail Akun:*%0A- Username: ${encodeURIComponent(username)}%0A- Password: ${encodeURIComponent(password)}%0A%0ACepat Min Gw Mau Pake Apk nya 🤤🤤🤤.`;

            // Redirect otomatis ke aplikasi WhatsApp
            const whatsappURL = `https://wa.me/${phoneNumber}?text=${message}`;
            window.location.href = whatsappURL;
        });
    </script>

</body>
</html>
